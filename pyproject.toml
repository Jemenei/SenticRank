[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "senticrank"
version = "2.0.0"
description = "Hybrid ML ranking system for Kaspi.kz marketplace"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "joblib>=1.3",
]

[project.scripts]
senticrank = "senticrank.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
